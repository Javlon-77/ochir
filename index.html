
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #153b72, transparent 50%),
        linear-gradient(135deg, #050816, #10152b);
    }

    .container {
      width: 90%;
      max-width: 500px;
      padding: 45px 25px;
      text-align: center;
      border: 1px solid #294c82;
      border-radius: 22px;
      background: rgba(10, 20, 43, 0.9);
      box-shadow: 0 0 45px #1261bd30;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    p {
      color: #aabbd6;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(90deg, #1769ff, #00b8ff);
      transition: 0.25s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 25px #168aff80;
    }

    #message {
      margin-top: 20px;
      font-size: 14px;
      color: #8ecbff;
    }

    footer {
      margin-top: 30px;
      color: #647795;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">⚡</div>

    <h1>WELCOME</h1>

    <p>
      Saytimizga xush kelibsiz!
      Davom etish uchun boshlash tugmasini bosing.
    </p>

    <button id="startBtn">⬇ BOSHLASH</button>

    <div id="message" aria-live="polite"></div>

    <footer>MY WEBSITE © 2026</footer>
  </main>

  <script>
    const button = document.getElementById("startBtn");
    const message = document.getElementById("message");

    button.addEventListener("click", () => {
      // Shu nomni o'zingdagi fayl nomiga almashtir.
      const fileName = "myfile.zip";

      const link = document.createElement("a");
      link.href = fileName;
      link.download = fileName;

      document.body.appendChild(link);
      link.click();
      link.remove();

      message.textContent =
        "Yuklash boshlandi. Agar boshlanmasa, fayl mavjudligini tekshiring.";
    });
  </script>
</body>
</html>
