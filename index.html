
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Control</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      text-align: center;
      background: #1e293b;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px #0005;
    }

    button {
      padding: 15px 40px;
      font-size: 18px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Kompyuter boshqaruvi</h1>
    <p>Davom etish uchun boshlash tugmasini bosing.</p>
    <button onclick="boshlash()">Boshlash</button>
    <p id="status"></p>
  </div>

  <script>
    function boshlash() {
      const tasdiq = confirm(
        "Kompyuterni Sleep rejimiga o'tkazishga rozimisiz?"
      );

      if (tasdiq) {
        document.getElementById("status").textContent =
          "Rozilik berildi. Windows dasturini alohida ishga tushiring.";
      } else {
        document.getElementById("status").textContent =
          "Bekor qilindi.";
      }
    }
  </script>
</body>
</html>
