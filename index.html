
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Screen</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
}

.home {
  min-height: 100vh;
  display: grid;
  place-items: center;
}

button {
  padding: 15px 32px;
  border: 0;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

#screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
  color: white;
  align-items: center;
  justify-content: center;
  text-align: center;
}

#screen.active {
  display: flex;
}

.content {
  padding: 24px;
}

h1 {
  font-size: clamp(25px, 5vw, 42px);
  letter-spacing: 3px;
}

p {
  color: #999;
}

#exit {
  position: fixed;
  bottom: 24px;
  right: 24px;
  padding: 10px 16px;
  font-size: 14px;
  background: #292929;
  border: 1px solid #555;
}

.hint {
  font-size: 12px;
  color: #666;
  margin-top: 28px;
}
</style>
</head>
<body>

<div class="home" id="home">
  <div style="text-align:center;padding:20px">
    <h1>System Control</h1>
    <p>Davom etish uchun boshlash tugmasini bosing.</p>
    <button id="start">Boshlash</button>
  </div>
</div>

<div id="screen" role="dialog" aria-label="Qora ekran rejimi">
  <div class="content">
    <h1>SCREEN LOCK</h1>
    <p>Ekran rejimi yoqildi.</p>
    <p class="hint">Chiqish uchun ESC tugmasini bosing</p>
  </div>
  <button id="exit">Chiqish ✕</button>
</div>

<script>
const screen = document.getElementById("screen");
const home = document.getElementById("home");

document.getElementById("start").addEventListener("click", async () => {
  screen.classList.add("active");
  home.style.display = "none";

  // Brauzer ruxsat bersa, to'liq ekran rejimini yoqadi.
  try {
    await document.documentElement.requestFullscreen();
  } catch (e) {
    // Fullscreen ruxsati bo'lmasa, qora qatlam ishlashda davom etadi.
  }
});

function exitScreen() {
  screen.classList.remove("active");
  home.style.display = "grid";

  if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
  }
}

document.getElementById("exit").addEventListener("click", exitScreen);

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    exitScreen();
  }
});
</script>

</body>
</html>
