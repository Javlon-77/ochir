
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kompyuter boshqaruvi</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .panel {
      text-align: center;
      padding: 40px;
      background: #1e293b;
      border-radius: 20px;
      box-shadow: 0 10px 40px #0005;
    }

    button {
      padding: 14px 35px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Kompyuter boshqaruvi</h1>
    <p>Davom etish uchun tugmani bosing.</p>
    <button onclick="boshlash()">Boshlash</button>
    <p id="natija"></p>
  </div>

  <script>
    function boshlash() {
      const ruxsat = confirm(
        "Kompyuterni Sleep rejimiga o'tkazishni xohlaysizmi?"
      );

      if (ruxsat) {
        document.getElementById("natija").textContent =
          "Tasdiqlandi. Sleep funksiyasi uchun mahalliy dastur kerak.";
      } else {
        document.getElementById("natija").textContent =
          "Amal bekor qilindi.";
      }
    }
  </script>
</body>
</html>
